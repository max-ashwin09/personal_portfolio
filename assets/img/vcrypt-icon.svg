<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="VCRYPT Dragon Emblem">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#171a23"/>
      <stop offset="55%" stop-color="#111319"/>
      <stop offset="100%" stop-color="#080a0e"/>
    </linearGradient>
    <linearGradient id="fireGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8587"/>
      <stop offset="48%" stop-color="#ff4d4f"/>
      <stop offset="100%" stop-color="#c91d28"/>
    </linearGradient>
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d4f"/>
      <stop offset="100%" stop-color="#9e121b"/>
    </linearGradient>
    <filter id="glow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded Obsidian Cyber Shield Badge -->
  <rect x="20" y="20" width="472" height="472" rx="108" fill="url(#bgGrad)" stroke="url(#fireGrad)" stroke-width="10"/>
  <rect x="38" y="38" width="436" height="436" rx="92" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>

  <!-- Subtle Cyber Circuit Accents -->
  <g stroke="#38bdf8" stroke-opacity="0.36" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M68 122 L114 122 L134 142"/>
    <path d="M444 122 L398 122 L378 142"/>
    <path d="M74 334 L120 334 L142 312"/>
    <path d="M438 334 L392 334 L370 312"/>
  </g>
  <g fill="#38bdf8" fill-opacity="0.82">
    <circle cx="68" cy="122" r="5"/>
    <circle cx="444" cy="122" r="5"/>
    <circle cx="74" cy="334" r="5"/>
    <circle cx="438" cy="334" r="5"/>
  </g>

  <!-- FIERCE CYBER DRAGON FORMING THE 'V' SILHOUETTE -->
  <g filter="url(#glow)">
    <!-- Great Sweeping Dragon Wing (Right/Upper Arm of V) -->
    <path d="M254 274 L306 168 L368 106 L444 90 L402 148 L434 166 L382 192 L408 214 L344 234 L362 256 L296 276 L264 316 Z" fill="url(#wingGrad)"/>
    <path d="M272 258 L358 134 M282 264 L388 184 M288 272 L346 226" stroke="#ff9c9e" stroke-opacity="0.5" stroke-width="3" stroke-linecap="round"/>

    <!-- Swept Horns -->
    <path d="M168 96 L94 56 L138 112 Z" fill="url(#fireGrad)"/>
    <path d="M192 92 L144 44 L174 104 Z" fill="#ff8587"/>
    <!-- Fierce Snapping Dragon Head in Profile facing Right -->
    <path d="M138 112 L182 88 L236 96 L278 118 L244 134 L222 132 L252 150 L214 162 L180 156 L160 178 L142 156 L124 136 Z" fill="url(#fireGrad)"/>
    <!-- Glowing Cyber Dragon Eye & Jaw Teeth -->
    <polygon points="184,114 214,110 202,122 178,122" fill="#38bdf8"/>
    <polygon points="228,128 242,132 232,140" fill="#ffffff"/>
    <polygon points="212,130 224,134 214,142" fill="#ffffff"/>
    <!-- Curved Armored Neck + Dorsal Spines Sweeping Down into V Vertex -->
    <path d="M142 156 C132 204, 152 258, 224 316 L256 340 L282 312 C228 264, 198 220, 198 166 Z" fill="url(#fireGrad)"/>
    <!-- Jagged Dorsal Back Spikes along Left Neck -->
    <path d="M134 174 L106 168 L132 194 L104 202 L138 222 L116 238 L152 252 L138 276 L178 286" fill="url(#fireGrad)"/>
    <!-- Glowing Steel Belly Plates forming inner V Edge -->
    <path d="M186 168 C190 218, 214 264, 256 308 C272 288, 286 266, 298 242 L286 244 C274 266, 264 282, 256 292 C224 256, 202 214, 198 172 Z" fill="#2b3140" stroke="#38bdf8" stroke-opacity="0.7" stroke-width="2.5"/>
  </g>

  <!-- Dragon Barbed Tail Looping Around V Vertex -->
  <path d="M256 334 L256 356 L236 342 L256 376 L276 342 L256 356" fill="url(#fireGrad)"/>

  <!-- Integrated Dark Crest Banner Containing VCRYPT -->
  <path d="M78 352 L114 338 L398 338 L434 352 L416 430 L256 448 L96 430 Z" fill="#0c0e13" stroke="url(#fireGrad)" stroke-width="6" stroke-linejoin="round"/>
  <path d="M110 350 L402 350" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="2"/>

  <!-- Geometric Crisp Vector Lettering: V C R Y P T -->
  <g transform="translate(-6, 0)" fill="#ffffff" stroke="none">
    <!-- V (coral-red accent) -->
    <path d="M116 368 L130 368 L142 399 L154 368 L168 368 L149 414 L135 414 Z" fill="url(#fireGrad)"/>
    <!-- C -->
    <path d="M178 376 C178 371 182 368 188 368 L216 368 L216 378 L191 378 L191 404 L216 404 L216 414 L188 414 C182 414 178 411 178 406 Z"/>
    <!-- R -->
    <path d="M226 368 L256 368 C262 368 266 372 266 378 L266 387 C266 392 263 395 258 396 L268 414 L254 414 L246 397 L238 397 L238 414 L226 414 Z M238 378 L238 388 L254 388 L254 378 Z"/>
    <!-- Y -->
    <path d="M274 368 L288 368 L297 385 L306 368 L320 368 L303 396 L303 414 L291 414 L291 396 Z"/>
    <!-- P -->
    <path d="M328 368 L356 368 C362 368 366 372 366 378 L366 389 C366 395 362 399 356 399 L340 399 L340 414 L328 414 Z M340 378 L340 389 L354 389 L354 378 Z"/>
    <!-- T -->
    <path d="M372 368 L408 368 L408 378 L396 378 L396 414 L384 414 L384 378 L372 378 Z"/>
  </g>
</svg>
